<div class="component">
  <form class="centerWrapper" [formGroup]="form">
    @if (form.controls.username.touched && form.controls.username.errors) {
      <div class="error">
        Неверно заполнено поле пользователь
      </div>
    }
    @if (form.controls.password.touched && form.controls.password.errors) {
      <div class="error">
        Неверно заполнено поле пароль
      </div>
    }

    <div class="logo">
      <img src="/images/logo.png" alt="logo" />
    </div>

    <div class="text">
      Вход
    </div>

    <div class="inputUserName">
      <app-input
        prefixIcon="/icons/UserRounded.svg"
        formControlName="username"
      />
    </div>

    <div class="inputPassword">
      <app-password-input
        formControlName="password"
      />
    </div>

    <app-button
      text="Войти"
      [disabled]="isDisabled()"
      (btnClick)="onLoginClick()"
    />
  </form>
</div>
