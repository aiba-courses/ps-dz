<div class="component">
  <div class="centerWrapper">
    <div class="logo">
      <img src="/images/logo.png" alt="logo" />
    </div>

    <div class="text">
      Вход
    </div>

    <div class="inputUserName">
      <app-input
        [value]="userName"
        image="/icons/UserRounded.svg"
        (valueChange)="onUserNameChange($event)"
      />
    </div>

    <div class="inputPassword">
      <app-password-input
        [value]="password"
        (valueChange)="onPasswordChange($event)"
      />
    </div>

    <app-button
      text="Войти"
      (btnClick)="onLoginClick()"
    />
  </div>
</div>
