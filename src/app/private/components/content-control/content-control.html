<div class="component">
  <form [formGroup]="form">
    <div class="block">
      <app-search-input
        formControlName="search"
      />
    </div>

    <div class="block">
      <div class="title">Жанр</div>
      <app-radio-list
        formControlName="genres"
        [list]="genres()"
      />
    </div>

    <div class="block">
      <div class="title">Дата выхода</div>
      <app-from-to-date />
    </div>

    <div class="block">
      <div class="title">Сортировать</div>
      @if (filters()) {
        <app-radio-list
          formControlName="sortBy"
          [list]="sortOptions"
        />
      }
    </div>
  </form>
</div>
