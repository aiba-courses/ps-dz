<div class="component">
  <img
    class="iconMain"
    src="/icons/Lock.svg"
    alt="lock"
  />

  <input
    [type]="isShowPass ? 'text' : 'password'"
    [value]="value"
    (input)="onInput($event)"
  />

  <img
    class="iconEye"
    [src]="(isShowPass) ? '/icons/Eye.svg' : '/icons/EyeClosed.svg'"
    alt="eye"
    (click)="onEyeClick()"
  />
</div>
