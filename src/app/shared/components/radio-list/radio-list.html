<div class="component">
  @for(item of list(); track item.id) {
    <div class="item"
      (click)="onSelectItem(item.id)"
    >
      <img
        [src]="(item.id === current) ? '/icons/radio-active-item.png' : '/icons/radio-item.svg'"
        width="24"
        height="24"
        alt="radio"
      />

      <span>{{ item.name }}</span>
    </div>
  }
</div>
